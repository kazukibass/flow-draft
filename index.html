<html lang="ja"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e0e0f">
<link rel="apple-touch-icon" href="icon.png">
<title>FlowDraft — システム設計フローチャート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://kazukibass.github.io/assets/shell.css">
<script src="https://kazukibass.github.io/assets/shell.js"
        data-tool="FlowDraft"
        data-kicker="SYSTEM DESIGN"
        data-adopt="#toolbar"
        data-adopt-min="901"
        data-slim="mobile"
        data-theme-attr="class"
        data-theme-dark="theme-dark"></script>
</head>
<body>
<div id="app">
  <!-- TOOLBAR -->
  <div id="toolbar">
    <div class="logo">flow<span>draft</span></div>
    <div class="sep"></div>
    <button class="tb-btn" id="btn-new" data-tip="新規">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="10" height="12" rx="1"/><line x1="5" y1="6" x2="9" y2="6"/><line x1="5" y1="9" x2="9" y2="9"/></svg>
    </button>
    <button class="tb-btn" id="btn-tpl" data-tip="テンプレート">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
    </button>
    <div class="sep"></div>
    <button class="tb-btn" id="btn-undo" data-tip="元に戻す">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8a5 5 0 1 1 1.5 3.5"/><polyline points="3,4 3,8 7,8"/></svg>
    </button>
    <button class="tb-btn" id="btn-redo" data-tip="やり直し">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 8a5 5 0 1 0-1.5 3.5"/><polyline points="13,4 13,8 9,8"/></svg>
    </button>
    <div class="sep"></div>
    <button class="tb-btn" id="btn-conn" data-tip="接続モード (C)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9.5 2.5l-7 7a2.121 2.121 0 0 0 3 3l7-7"/><path d="M6.5 13.5l-1 1"/><path d="M9.5 2.5l1-1"/><path d="M11 5l-4 4"/></svg>
    </button>
    <button class="tb-btn" id="btn-select" data-tip="選択モード (V)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 2l10 6-5 1-2 5z"/></svg>
    </button>
    <div class="sep"></div>
    <button class="tb-btn" id="btn-fit" data-tip="全体を表示 (F)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 5V2h3"/><path d="M11 2h3v3"/><path d="M14 11v3h-3"/><path d="M5 14H2v-3"/></svg>
    </button>
    <button class="tb-btn" id="btn-group" data-tip="処理領域にまとめる" disabled aria-label="選択したノードを処理領域にまとめる">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 5.5C2.5 3.6 4 2 6 2h4c2 0 3.5 1.6 3.5 3.5v5c0 1.9-1.5 3.5-3.5 3.5H6c-2 0-3.5-1.6-3.5-3.5z" stroke-dasharray="2 1.5"/></svg>
    </button>
    <div class="tb-title"></div>
    <input id="diagram-name-pc" class="pc-only-input" value="無題のフロー" maxlength="4096" spellcheck="false" aria-label="フロー名">
    <div class="tb-title"></div>
    <button class="tb-btn view-mode-button" id="btn-view" aria-pressed="false">閲覧モード</button>
    <button class="tb-btn" id="btn-share" data-tip="共有URL">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="13" cy="3" r="1.5"/><circle cx="13" cy="13" r="1.5"/><circle cx="3" cy="8" r="1.5"/><line x1="4.5" y1="7.2" x2="11.5" y2="3.8"/><line x1="4.5" y1="8.8" x2="11.5" y2="12.2"/></svg>
    </button>
    <button class="tb-btn" id="btn-export" data-tip="エクスポート">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8m-3-3 3 3 3-3"/><path d="M3 13h10"/></svg>
    </button>
    <button class="tb-btn" id="btn-theme" data-tip="テーマ切替">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5 A5.5 5.5 0 0 1 8 13.5 Z" fill="currentColor" stroke="none" opacity="0.5"/></svg>
    </button>
    <button class="tb-btn" id="btn-canvas-bg" data-tip="背景色">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="2"/><circle cx="8" cy="8" r="2.5" fill="currentColor" opacity="0.5"/></svg>
    </button>
  </div>

  <div id="main">
    <!-- LEFT PANEL（デスクトップのみ） -->
    <div id="left-panel">
      <div class="panel-section">
        <div class="panel-label">ノード</div>
        <div class="node-palette" id="palette"></div>
      </div>
    </div>

    <!-- モバイル用ノード追加メニュー -->
    <div id="mobile-node-menu">
      <div class="modal">
        <h3>ノードを追加</h3>
        <div class="node-palette" id="mobile-node-grid"></div>
        <div class="modal-btn-row">
          <button class="modal-btn" onclick="closeModal('mobile-node-menu')">閉じる</button>
        </div>
      </div>
    </div>

    <!-- CANVAS -->
    <div id="canvas-wrap">
      <div id="canvas">
        <svg id="svg-layer" width="4000" height="4000"></svg>
      </div>
      <div id="sel-box"></div>
      <div id="zoom-controls" aria-label="ズーム操作">
        <button class="zoom-btn" id="btn-zoom-out" aria-label="縮小">−</button>
        <span id="zoom-label">100%</span>
        <button class="zoom-btn" id="btn-zoom-in" aria-label="拡大">+</button>
      </div>
      <div id="minimap">
        <canvas id="minimap-canvas"></canvas>
        <div id="minimap-viewport"></div>
      </div>
    </div>

    <div id="view-strip" hidden>
      <span>閲覧中</span>
      <button id="view-panel-toggle" type="button">経路・詳細</button>
      <button id="view-exit" type="button">編集に戻る</button>
      <p id="view-status" role="status"></p>
    </div>

    <!-- RIGHT PANEL -->
    <div id="right-panel"></div>
  </div>

  <div id="statusbar">
    <span>ノード: <span class="status-val" id="st-nodes">0</span></span>
    <span>接続: <span class="status-val" id="st-conns">0</span></span>
    <span>モード: <span class="status-val" id="st-mode">選択</span></span>
    <span style="margin-left:auto" id="st-save" aria-live="polite">自動保存</span>
  </div>
</div>

<!-- CONTEXT MENU -->
<div id="ctx-menu">
  <div class="ctx-item" id="ctx-edit"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 2l3 3-8 8H3v-3z"/></svg> ラベル編集</div>
  <div class="ctx-item" id="ctx-dup"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="9" height="9" rx="1"/><path d="M2 11V2h9"/></svg> 複製</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item danger" id="ctx-del"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="3,4 4,14 12,14 13,4"/><line x1="2" y1="4" x2="14" y2="4"/><line x1="6" y1="7" x2="6" y2="11"/><line x1="10" y1="7" x2="10" y2="11"/></svg> 削除</div>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="modal-share">
  <div class="modal">
    <h3>共有URL</h3>
    <div class="share-url" id="share-url-text">生成中...</div>
    <div style="font-size:10px;color:var(--text3);margin-bottom:4px;font-family:var(--mono)">このURLで現在のフローを共有できます</div>
    <div class="modal-btn-row">
      <button class="modal-btn" id="share-copy">URLをコピー</button>
      <button class="modal-btn" onclick="closeModal('modal-share')">閉じる</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-export">
  <div class="modal">
    <h3>エクスポート</h3>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <button class="modal-btn primary" id="exp-png">PNG 画像としてダウンロード</button>
      <button class="modal-btn primary" id="exp-svg">SVG ベクター画像</button>
      <button class="modal-btn primary" id="exp-json">JSON データ保存</button>
      <button class="modal-btn" id="exp-json-import" style="position:relative;overflow:hidden">
        JSONから読み込む
        <input type="file" accept=".json" id="import-file" style="position:absolute;inset:0;opacity:0;cursor:pointer;">
      </button>
    </div>
    <div class="modal-btn-row">
      <button class="modal-btn" onclick="closeModal('modal-export')">閉じる</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-tpl">
  <div class="modal" style="width:420px">
    <h3>テンプレート</h3>
    <div class="tpl-grid" id="tpl-grid"></div>
    <div class="modal-btn-row">
      <button class="modal-btn" onclick="closeModal('modal-tpl')">キャンセル</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-canvas-bg">
  <div class="modal">
    <h3>キャンバス背景色</h3>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px" id="canvas-bg-presets"></div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
      <input type="color" id="canvas-bg-custom" style="width:32px;height:32px;border-radius:8px;border:1px solid var(--border2);padding:2px;cursor:pointer;background:transparent;">
      <span style="font-size:11px;color:var(--text2);font-family:var(--mono)">カスタムカラー</span>
    </div>
    <div class="modal-btn-row">
      <button class="modal-btn" onclick="closeModal('modal-canvas-bg')">閉じる</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-new">
  <div class="modal">
    <h3>新しいフローを作成</h3>
    <div style="font-size:12px;color:var(--text2);margin-bottom:16px;">現在の作業は失われます。続けますか？</div>
    <div class="modal-btn-row">
      <button class="modal-btn" onclick="closeModal('modal-new')">キャンセル</button>
      <button class="modal-btn primary" id="confirm-new">新規作成</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-settings">
  <div class="modal">
    <h3>メニュー</h3>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <input id="diagram-name-mobile" class="mobile-only-input" value="無題のフロー" maxlength="4096" spellcheck="false" aria-label="フロー名">
      <button class="modal-btn" id="settings-view" aria-pressed="false">閲覧モード</button>
      <button class="modal-btn primary" id="settings-tpl">📋 テンプレート</button>
      <button class="modal-btn primary" id="settings-export">↓ エクスポート・読み込み</button>
      <button class="modal-btn" id="settings-share">🔗 共有URL</button>
      <button class="modal-btn" id="settings-theme">◐ ダーク / ライト切り替え</button>
      <button class="modal-btn" id="settings-canvas-bg">🎨 キャンバス背景色</button>
      <button class="modal-btn" id="settings-group">◌ 処理領域を作る</button>
      <button class="modal-btn" id="settings-reset">⌖ 表示位置をリセット</button>
      <button class="modal-btn danger" id="settings-new">新しいフローを作成</button>
    </div>
    <div class="modal-btn-row">
      <button class="modal-btn" onclick="closeModal('modal-settings')">閉じる</button>
    </div>
  </div>
</div>

<!-- MOBILE TOOLBAR -->
<div id="mobile-toolbar">
  <div class="mobile-bottom-row">
    <button class="mobile-fab icon-only primary" id="m-add" title="ノードを追加" aria-label="ノードを追加">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/></svg>
    </button>
    <button class="mobile-fab icon-only" id="m-connect" title="接続モード">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9.5 2.5l-7 7a2.121 2.121 0 0 0 3 3l7-7"/><path d="M6.5 13.5l-1 1"/><path d="M9.5 2.5l1-1"/><path d="M11 5l-4 4"/></svg>
    </button>
    <button class="mobile-fab icon-only" id="m-undo" title="元に戻す">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8a5 5 0 1 1 1.5 3.5"/><polyline points="3,4 3,8 7,8"/></svg>
    </button>
    <button class="mobile-fab icon-only" id="m-fit" title="全体を表示">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 5V2h3"/><path d="M11 2h3v3"/><path d="M14 11v3h-3"/><path d="M5 14H2v-3"/></svg>
    </button>
    <button class="mobile-fab icon-only" id="m-settings" title="メニュー" aria-label="メニュー">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/></svg>
    </button>
  </div>
</div>

<div id="mobile-group-toolbar" hidden aria-live="polite">
  <span id="mobile-group-count">0個選択</span>
  <button class="mobile-group-action" id="mobile-group-cancel" type="button">キャンセル</button>
  <button class="mobile-group-action primary" id="mobile-group-create" type="button" disabled>作成</button>
</div>

<div id="notif"></div>

<script src="diagram-data.js"></script>
<script src="graph-query.js"></script>
<script src="theme.js"></script>
<script src="storage.js"></script>
<script src="export.js"></script>
<script src="app.js"></script>
<script src="view-mode.js"></script>

</body></html>
